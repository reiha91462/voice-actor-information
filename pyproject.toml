[project]
name = "voice-actor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "google-genai>=2.16.0",
    "ipykernel>=7.3.0",
    "numpy>=2.2.6",
